version: '3.8'

services:
  telegram-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: telegram-mcp
    # Load environment variables from a .env file in the same directory
    env_file:
      - .env
    # Serve streamable HTTP so one long-lived container is shared by all MCP
    # clients (see the Transports section in README.md). MCP_HOST must be
    # 0.0.0.0 inside the container for the published port to work.
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      # This fork refuses to send, edit, delete or mark anything read.
      TELEGRAM_HARD_READONLY: "1"
      TELEGRAM_EXPOSED_TOOLS: read-only
      TELEGRAM_DATA_DIR: /app/data
      TELEGRAM_ARCHIVE_MEDIA: photos
      TELEGRAM_TRANSCRIPT_CACHE_DIR: /app/data/transcripts
      # File session on the data volume. A TELEGRAM_SESSION_STRING in .env
      # still wins until you remove it (see DEPLOY.md).
      TELEGRAM_SESSION_NAME: /app/data/telegram_session
    # Inside the container the server binds 0.0.0.0, so MCP_AUTH_TOKEN in
    # .env is required. Publish on localhost only as well.
    ports:
      - "127.0.0.1:8765:8765"
    # Optional: Uncomment the following lines to mount a local directory
    # for persisting the Telegram session file if NOT using TELEGRAM_SESSION_STRING.
    # Replace './telegram_sessions' with your desired host path.
    # volumes:
    #   - ./telegram_sessions:/app
    volumes:
      # Session file, deleted-message archive and transcript cache.
      # Host directory must be writable by uid 1000 (appuser):
      #   mkdir -p ./data && sudo chown -R 1000:1000 ./data
      - ./data:/app/data
    restart: unless-stopped
