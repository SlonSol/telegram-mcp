services:
  telegram-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    container_name: telegram-mcp-shared
    env_file:
      - ../../.env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      TELEGRAM_HARD_READONLY: "1"
      TELEGRAM_EXPOSED_TOOLS: read-only
      TELEGRAM_DATA_DIR: /app/data
      TELEGRAM_ARCHIVE_MEDIA: photos
      TELEGRAM_TRANSCRIPT_CACHE_DIR: /app/data/transcripts
      TELEGRAM_SESSION_NAME: /app/data/telegram_session
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../../data:/app/data
    restart: unless-stopped
